kind = "web"
previewPath = "/"
title = "Worker Portal"
description = "A Firebase-powered worker management portal with role-based admin and worker dashboards, email submission moderation, configurable submit rules, tier rates, balances, and withdrawal processing."
version = "1.0.0"
id = "artifacts/worker-portal"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20171

[services.development]
run = "pnpm --filter @workspace/worker-portal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/worker-portal", "run", "build" ]
serve = "static"
publicDir = "artifacts/worker-portal/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20171"
BASE_PATH = "/"
